<!DOCTYPE html>
<html>
<head>
    <title>Layout 2</title>
    <style>
        .search-box {
            width: 100%;
        }
        .profile-box {
            width: 55px;
            height: 50px;
            border: 1px solid black;
        }
        .icon-box {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
<table border="1" width="900" height="600" align="center" cellspacing="0">
    <tr height="80">
        <td width="150" align="center">
            <b>&lt;Logo&gt;</b>
        </td>
        <td width="500">
            <b>&lt;Menu&gt;</b>
            <br><br>
            <table width="100%">
                <tr>
                    <td width="80%">
                        <input type="text" class="search-box">
                    </td>
                    <td align="center">
                        <button><b>Search</b></button>
                    </td>
                </tr>
            </table>
        </td>
        <td width="200">
            <table width="100%">
                <tr>
                    <td rowspan="2" width="70">
                        <div class="profile-box"></div>
                    </td>
                    <td>
                        <b>Welcome<br>Mr. Carlson</b>
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="icon-box"></div>
                        <div class="icon-box"></div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr height="430">
        <td width="150"></td>
        <td colspan="2"></td>
    </tr>
    <tr height="40">
        <td colspan="2">
            <b>@Zerone Consulting 2022</b>
        </td>
        <td align="right">
            <small>
                <b>Terms &amp; Conditions</b>
                &nbsp;&nbsp;&nbsp;
                <b>Privacy Policy</b>
            </small>
        </td>
    </tr>
</table>
</body>
</html>
